name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install project SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Check formatting
        run: bash ./gradlew :spotlessCheck --no-daemon --console=plain
      - name: Build, unit test and lint
        run: bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install SDK and generic API 34 image
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
      - name: Build diagnostic APKs before emulator startup
        run: bash ./gradlew -Pcom5Diagnostic=true :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Boot isolated Android emulator
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          avdmanager create avd --name com5-ui-api34 --package "system-images;android-34;google_apis;x86_64" --device pixel_2 <<< no
          python3 - <<'PYCONFIG'
          from pathlib import Path
          p = Path.home() / ".android/avd/com5-ui-api34.avd/config.ini"
          lines = p.read_text().splitlines()
          key = "disk.dataPartition.size="
          found = any(line.startswith(key) for line in lines)
          lines = [key + "2G" if line.startswith(key) else line for line in lines]
          if not found:
              lines.append(key + "2G")
          p.write_text("\n".join(lines) + "\n")
          PYCONFIG
          "$ANDROID_HOME/emulator/emulator" @com5-ui-api34 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect > "$RUNNER_TEMP/com5-emulator.log" 2>&1 &
          python3 scripts/check-com5-device.py --serial emulator-5554 --wait-for-boot --emulator-pid "$!" || {
            tail -80 "$RUNNER_TEMP/com5-emulator.log"
            exit 1
          }
          adb -s emulator-5554 shell input keyevent 82
      - name: Run real Android widgets with synthetic UX and data
        run: bash ./gradlew -Pcom5Diagnostic=true -Pandroid.testInstrumentationRunnerArguments.class=com.example.pleos_pa.ui.DriverUiTest :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Capture synthetic journal metrics
        run: adb -s emulator-5554 logcat -d -s COM5_METRICS:I '*:S' > "$RUNNER_TEMP/com5-ui-metrics.txt"
      - name: Prepare diagnostic APK for the independent restart check
        run: |
          adb -s emulator-5554 shell pm path com.example.pleos_pa.com5 > "$RUNNER_TEMP/com5-post-test-install.txt" || true
          adb -s emulator-5554 push app/build/outputs/apk/debug/app-debug.apk /data/local/tmp/com5-app.apk
          adb -s emulator-5554 shell timeout 60 pm install -r -t /data/local/tmp/com5-app.apk
      - name: Verify shared journal across actual process restart
        run: |
          python3 scripts/check-com5-device.py --serial emulator-5554 --output "$RUNNER_TEMP/com5-process-restart.json" || {
            adb -s emulator-5554 logcat -d -s COM5_STATE:I AndroidRuntime:E '*:S' > "$RUNNER_TEMP/com5-probe-error.txt"
            exit 1
          }
      - name: Keep UI and process evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: com5-android-ui-evidence
          retention-days: 14
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/com5-process-restart.json
            ${{ runner.temp }}/com5-ui-metrics.txt
            ${{ runner.temp }}/com5-post-test-install.txt
            ${{ runner.temp }}/com5-probe-error.txt
            ${{ runner.temp }}/com5-emulator.log

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Detect MCP implementation
        id: mcp
        shell: bash
        run: |
          if [ -f mcp/package.json ]; then
            test -f mcp/package-lock.json
            test -s mcp/.node-version
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -d mcp ]; then
            echo "::error::mcp directory exists without package.json"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "MCP not implemented; npm checks are not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v6
        if: steps.mcp.outputs.present == 'true'
        with:
          node-version-file: mcp/.node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked dependencies
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm ci
      - name: Type check MCP
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm run typecheck
      - name: Lint MCP
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm run lint
      - name: Check MCP formatting
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm run format:check
      - name: Test MCP
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm test

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download pinned Structurizr
        run: curl --fail --location --retry 2 https://download.structurizr.com/structurizr-2026.09.19.war --output "$RUNNER_TEMP/structurizr.war"
      - name: Validate model
        run: java -jar "$RUNNER_TEMP/structurizr.war" validate -workspace docs/architecture/workspace.dsl
