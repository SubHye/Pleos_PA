name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install project SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build, unit test and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Detect MCP implementation
        id: mcp
        shell: bash
        run: |
          if [ -f mcp/package.json ]; then
            test -f mcp/package-lock.json
            test -s mcp/.node-version
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -d mcp ]; then
            echo "::error::mcp directory exists without package.json"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "MCP not implemented; npm checks are not applicable." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v6
        if: steps.mcp.outputs.present == 'true'
        with:
          node-version-file: mcp/.node-version
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install locked dependencies
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm ci
      - name: Test MCP
        if: steps.mcp.outputs.present == 'true'
        working-directory: mcp
        run: npm test

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download pinned Structurizr
        run: curl --fail --location --retry 2 https://download.structurizr.com/structurizr-2026.09.19.war --output "$RUNNER_TEMP/structurizr.war"
      - name: Validate model
        run: java -jar "$RUNNER_TEMP/structurizr.war" validate -workspace docs/architecture/workspace.dsl
