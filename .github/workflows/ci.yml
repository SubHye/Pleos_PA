name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
      - name: Install project SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Check formatting
        run: bash ./gradlew :spotlessCheck --no-daemon --console=plain
      - name: Build, unit test and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :vehicle-sweep:test --no-daemon --console=plain

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Download pinned Structurizr
        run: curl --fail --location --retry 2 https://download.structurizr.com/structurizr-2026.09.19.war --output "$RUNNER_TEMP/structurizr.war"
      - name: Validate model
        run: java -jar "$RUNNER_TEMP/structurizr.war" validate -workspace docs/architecture/workspace.dsl
